; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:makergo_esp32c3_supermini]
platform = espressif32
framework = arduino
board = makergo_esp32c3_supermini
board_build.filesystem = littlefs
board_build.variant = super_mini_esp32c3
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
; PlatformIO 的 C3 预编译库不含 Bluedroid 协议栈，BluFi 无法编译，
; 改用 src/ble/blufi_stub.cpp（AP 热点 + 网页配网）。
build_src_filter = +<*> -<ble/blufi.cpp> -<ble/blufi_security.cpp>
extra_scripts =
    pre:script/inject_app_version.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0